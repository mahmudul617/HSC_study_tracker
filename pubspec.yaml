name: study_tracker
description: "A production-quality offline-first study tracker for HSC 2027 students in Bangladesh."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  flutter_riverpod: ^2.5.1
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2
  path: ^1.9.0
  go_router: ^13.2.0
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.8
  math_expressions: any
  confetti: ^0.7.0
  flutter_animate: ^4.5.0
  share_plus: ^9.0.0
  file_picker: ^8.0.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  drift_dev: ^2.16.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/syllabus_seed.json